name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-mcp.txt
            requirements-a2a.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-mcp.txt -r requirements-a2a.txt
      - run: python -m pytest -q -W error::pytest.PytestUnhandledThreadExceptionWarning tests
      - name: Offline evaluation harness (no model)
        run: python -m evals.runner --split all --run-name ci-offline --output /tmp/agent-eval-smoke

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
